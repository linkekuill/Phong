<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chấm công QR</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #1e1e1e;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    #resultBox {
      display: none;
      flex-direction: column;
      align-items: center;
      background-color: #333;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      max-width: 90%;
    }
    #qrResultAvatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 10px;
      border: 2px solid #fff;
    }
    #qrResultName,
    #qrResultShift,
    #qrResultTime,
    #qrResultStatus {
      margin: 6px 0;
      font-size: 16px;
    }
    #qrResultStatus {
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <h2>📷 Đang xử lý chấm công...</h2>

  <div id="resultBox">
    <img id="qrResultAvatar" src="" alt="Avatar">
    <div id="qrResultName">👤 Tên: ...</div>
    <div id="qrResultShift">📅 Ca: ...</div>
    <div id="qrResultTime">🕒 Thời gian: ...</div>
    <div id="qrResultStatus">Đang kiểm tra trạng thái...</div>
  </div>

  <script src="checkin.js"></script>
</body>
</html>
