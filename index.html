<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hệ thống chấm công</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📋 Hệ thống chấm công</h1>

<!-- Đăng nhập -->
<div id="loginScreen">
  <h2>🔐 Đăng nhập</h2>
  <input type="text" id="loginEmail" placeholder="Email"><br>
  <input type="password" id="loginPassword" placeholder="Mật khẩu"><br>
  <button onclick="login()">Đăng nhập</button>
  <p>Chưa có tài khoản? <a href="#" onclick="showRegister()">Đăng ký</a></p>
</div>

<!-- Đăng ký -->
<div id="registerScreen">
  <h2>📝 Đăng ký tài khoản</h2>
  <input type="text" id="regEmail" placeholder="Email"><br>
  <input type="text" id="regName" placeholder="Tên công nhân"><br>
  <input type="text" id="regPhone" placeholder="Số điện thoại"><br>
  <input type="password" id="regPassword" placeholder="Mật khẩu"><br>
  <button onclick="register()">Đăng ký</button>
  <p>Đã có tài khoản? <a href="#" onclick="showLogin()">Đăng nhập</a></p>
</div>

<!-- Giao diện chính -->
<div id="app">
  <button class="logout-btn" onclick="logout()">🚪 Đăng xuất</button>
  <h2>👋 Xin chào, <span id="userName"></span></h2>

  <div id="actionArea">
    <select id="shift">
      <option value="Sáng">☀️ Sáng</option>
      <option value="Chiều">🌙 Chiều</option>
    </select><br>
    <input type="text" id="reason" placeholder="Lý do nghỉ (nếu có)"><br>
    <button onclick="checkIn()">✅ Vào làm</button>
    <button onclick="checkOut()">⏰ Tan ca</button>
    <button onclick="takeLeave()">📌 Nghỉ phép</button>
    <button onclick="clearHistory()">🧹 Xoá lịch sử</button>
  </div>

  <div id="managerArea" style="display:none;">
    <button onclick="showEmployeeList()">👥 Thông tin công nhân</button>
    <button onclick="summarizeMonth()">📊 Tổng kết cuối tháng</button>
  </div>

  <div id="historyArea">
    <h3>📜 Lịch sử chấm công</h3>
    <div id="history"></div>

    <h3>📊 Thống kê theo ngày</h3>
    <div id="stats"></div>
  </div>
</div>

<div id="employeeList">
  <div id="employeeData"></div>
</div>

<div id="summaryArea">
  <h3>📈 Tổng kết cuối tháng</h3>
  <div id="summaryData"></div>
</div>

<script src="script.js"></script>
</body>
</html>
